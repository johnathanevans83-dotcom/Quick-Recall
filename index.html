<html lang="en">

<title>Westport Middle School Quick Recall Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 60 60%27%3E%3Cpath d=%27M6 6h48v26c0 14-11 22-24 24C17 54 6 46 6 32z%27 fill=%27%230B2A5B%27/%3E%3Ctext x=%2730%27 y=%2741%27 text-anchor=%27middle%27 font-family=%27Arial Black,Arial%27 font-weight=%27900%27 font-size=%2730%27 fill=%27white%27%3EW%3C/text%3E%3C/svg%3E">
<style>
  :root {
    /* Westport Middle School — Warhawks blue & white */
    --bg: #F2F6FC;
    --surface: #FFFFFF;
    --surface-alt: #E8EFFA;
    --ink: #0F2347;
    --ink-soft: #4A5B78;
    --navy: #0B2A5B;
    --blue: #1D4ED8;
    --sky: #3B82F6;
    --sky-light: #BFD4F7;
    --red: #C0392B;
    --line: #C9D6EA;
    --card-shadow: 0 3px 0 rgba(11,42,91,0.08), 0 8px 20px rgba(11,42,91,0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  h1, h2, h3 {
    font-family: 'Montserrat', 'Inter', sans-serif;
    font-weight: 800;
    margin: 0;
    color: var(--ink);
    letter-spacing: -0.01em;
  }

  /* ---------- Header ---------- */
  .masthead {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    margin-bottom: 22px;
    background: linear-gradient(135deg, var(--navy) 0%, #123A7A 100%);
    color: #fff;
    border-radius: 14px;
    border-bottom: 4px solid var(--sky);
    box-shadow: var(--card-shadow);
  }
  .masthead .mark {
    flex-shrink: 0;
    width: 64px; height: 64px;
    background: #fff;
    border-radius: 12px;
    padding: 6px;
    display: flex; align-items: center; justify-content: center;
  }
  .masthead .mark img, .masthead .mark svg { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .masthead h1 { font-size: 24px; line-height: 1.15; color: #fff; }
  .masthead p { margin: 5px 0 0; font-size: 13px; color: var(--sky-light); font-weight: 500; }
  .masthead p b { color: #fff; font-weight: 700; }

  .back-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .back-btn {
    background: none;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--navy);
    cursor: pointer;
    padding: 6px 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .back-btn:hover { text-decoration: underline; }

  /* ---------- Overall stats strip ---------- */
  .subject-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .subject-tab {
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--surface);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .subject-tab:hover { border-color: var(--sky); }
  .subject-tab.active {
    background: var(--navy);
    border-color: var(--navy);
    color: var(--surface);
  }

  .stats-strip {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
  }
  .stat-box {
    flex: 1;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 12px;
    text-align: center;
  }
  .stat-box .num { font-family: 'Montserrat', 'Inter', sans-serif; font-size: 22px; font-weight: 700; color: var(--navy); }
  .stat-box .lbl { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

  /* ---------- Category list ---------- */
  .sheet {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 5px solid var(--blue);
    border-radius: 3px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .sheet:hover { box-shadow: var(--card-shadow); transform: translateY(-1px); }
  .sheet .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .sheet .cat-name { font-family: 'Montserrat', 'Inter', sans-serif; font-size: 16.5px; font-weight: 600; }
  .sheet .cat-num { font-size: 11px; color: var(--ink-soft); letter-spacing: 0.02em; }
  .sheet .cat-desc { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }
  .progress-track {
    height: 6px;
    background: var(--surface-alt);
    border-radius: 3px;
    margin-top: 10px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; background: var(--blue); border-radius: 3px; }
  .pct-label { font-size: 11px; color: var(--ink-soft); margin-top: 4px; text-align: right; }


  /* ---------- Main nav (Study / Schedule) ---------- */
  .nav-row { display: flex; gap: 6px; background: var(--surface-alt); border: 1px solid var(--line);
             border-radius: 10px; padding: 4px; margin-bottom: 18px; }
  .nav-tab { flex: 1; padding: 9px 12px; border: none; border-radius: 7px; background: none;
             font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13.5px;
             color: var(--ink-soft); cursor: pointer; }
  .nav-tab.active { background: var(--surface); color: var(--navy); box-shadow: 0 1px 3px rgba(11,42,91,0.15); }

  /* ---------- Schedule ---------- */
  .next-up { background: linear-gradient(135deg, var(--navy) 0%, #123A7A 100%); color: #fff;
             border-radius: 12px; padding: 18px 20px; margin-bottom: 20px; box-shadow: var(--card-shadow); }
  .next-up .kicker { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
                     color: var(--sky-light); font-weight: 700; }
  .next-up .count { font-family: 'Montserrat','Inter',sans-serif; font-weight: 800; font-size: 34px;
                    line-height: 1.1; margin: 6px 0 2px; }
  .next-up .ev { font-size: 15px; font-weight: 600; }
  .next-up .meta { font-size: 12.5px; color: var(--sky-light); margin-top: 4px; }

  .sched-group { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
                 color: var(--ink-soft); margin: 22px 0 8px; }
  .event {
    display: flex; gap: 14px; align-items: flex-start;
    background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--line);
    border-radius: 6px; padding: 12px 14px; margin-bottom: 9px;
  }
  .event.key { border-left-color: var(--blue); }
  .event.done { opacity: 0.55; }
  .event .date { flex-shrink: 0; width: 46px; text-align: center; }
  .event .date .m { font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em;
                    text-transform: uppercase; color: var(--blue); }
  .event .date .d { font-family: 'Montserrat','Inter',sans-serif; font-weight: 800;
                    font-size: 20px; line-height: 1.1; color: var(--ink); }
  .event .body { flex: 1; min-width: 0; }
  .event .title { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
  .event .detail { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }
  .badge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
           text-transform: uppercase; padding: 3px 7px; border-radius: 4px; margin-top: 6px; }
  .badge.qr { background: var(--blue); color: #fff; }
  .badge.other { background: var(--surface-alt); color: var(--ink-soft); }
  .badge.deadline { background: #FBE9E7; color: var(--red); }
  .badge.ca { background: var(--navy); color: #fff; }
  .badge.sps, .badge.comp { background: var(--sky-light); color: var(--navy); }
  .badge.bye { background: var(--surface-alt); color: var(--ink-soft); }
  .event .teams { font-size: 12px; color: var(--navy); font-weight: 600; margin-top: 3px; }
  .practice { display: flex; gap: 12px; align-items: center; background: var(--surface-alt);
              border: 1px solid var(--sky-light); border-radius: 10px; padding: 12px 14px; margin-bottom: 18px; }
  .practice .ico { width: 36px; height: 36px; border-radius: 8px; background: var(--navy); color: #fff;
                   display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0; }
  .practice .t { font-weight: 700; font-size: 14px; color: var(--navy); }
  .practice .s { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }

  .subject-note {
    font-size: 12.5px;
    color: var(--ink-soft);
    border: 1px dashed var(--line);
    border-radius: 4px;
    padding: 10px 12px;
    margin-bottom: 20px;
    font-style: italic;
  }

  /* ---------- Category detail ---------- */
  .cat-header p { color: var(--ink-soft); font-size: 14px; margin-top: 6px; line-height: 1.5; }
  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
  .mode-card {
    background: var(--blue);
    color: var(--surface);
    border: none;
    border-radius: 5px;
    padding: 20px 14px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
  }
  .mode-card:nth-child(2) { background: var(--surface); color: var(--navy); border: 2px solid var(--navy); }
  .mode-card h3 { color: inherit; font-size: 17px; margin-bottom: 4px; }
  .mode-card p { margin: 0; font-size: 12px; opacity: 0.9; }
  .mode-card:hover { filter: brightness(1.05); }

  .mini-stats { display: flex; flex-wrap: wrap; gap: 10px 20px; margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); }
  .mini-stat { font-size: 13px; color: var(--ink-soft); }
  .mini-stat b { color: var(--ink); font-family: 'Montserrat', 'Inter', sans-serif; }

  /* ---------- Session (shared) ---------- */
  .session-progress { font-size: 12px; color: var(--ink-soft); margin-bottom: 10px; display: flex; justify-content: space-between; }

  /* ---------- Flashcard ---------- */
  .card-stage { perspective: 1200px; margin: 10px 0 18px; }
  .flashcard {
    position: relative;
    min-height: 240px;
    border-radius: 6px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
  }
  .flashcard.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: #FFFFFF;
    box-shadow: var(--card-shadow);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 30px 26px;
  }
  .face.front::before {
    content: '';
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    width: 34px; height: 8px;
    border-bottom: 2px solid var(--line);
    border-radius: 0 0 6px 6px;
  }
  .face .eyebrow { font-size: 11px; color: var(--blue); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 10px; }
  .face .term { font-family: 'Montserrat', 'Inter', sans-serif; font-size: 24px; line-height: 1.25; }
  .face.back { transform: rotateY(180deg); background: #EAF1FB; }
  .face .def { font-size: 15px; line-height: 1.55; color: var(--ink); }
  .tap-hint { text-align: center; font-size: 11.5px; color: var(--ink-soft); margin-top: -6px; margin-bottom: 16px; }

  .fc-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fc-btn {
    padding: 13px 10px;
    border-radius: 5px;
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .fc-btn.learning { background: var(--surface-alt); border: 1px solid var(--line); color: var(--ink); }
  .fc-btn.known { background: var(--blue); color: var(--surface); }
  .fc-btn:disabled { opacity: 0.5; cursor: default; }

  /* ---------- Quiz ---------- */
  .quiz-q {
    background: #FFFFFF;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 22px 20px;
    margin-bottom: 16px;
  }
  .quiz-q .term { font-family: 'Montserrat', 'Inter', sans-serif; font-size: 18px; line-height: 1.4; }
  .options { display: flex; flex-direction: column; gap: 9px; }
  .opt-btn {
    text-align: left;
    padding: 13px 14px;
    border-radius: 5px;
    border: 1px solid var(--line);
    background: var(--surface);
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    cursor: pointer;
    color: var(--ink);
  }
  .opt-btn:hover:not(:disabled) { border-color: var(--sky); }
  .opt-btn.correct { background: var(--blue); border-color: var(--blue); color: var(--surface); font-weight: 600; }
  .opt-btn.incorrect { background: var(--red); border-color: var(--red); color: var(--surface); font-weight: 600; }
  .opt-btn:disabled { cursor: default; }

  .next-row { margin-top: 16px; display: flex; justify-content: flex-end; }
  .primary-btn {
    background: var(--navy);
    color: var(--surface);
    border: none;
    border-radius: 5px;
    padding: 12px 22px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .primary-btn:hover { filter: brightness(1.1); }
  .ghost-btn {
    background: none;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 12px 22px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    color: var(--ink);
  }

  .score-banner {
    text-align: center;
    padding: 30px 20px;
    background: var(--surface-alt);
    border-radius: 6px;
    border: 1px solid var(--line);
  }
  .score-banner .big { font-family: 'Montserrat', 'Inter', sans-serif; font-size: 40px; font-weight: 700; color: var(--navy); }
  .score-banner p { color: var(--ink-soft); font-size: 14px; margin-top: 4px; }
  .score-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: center; flex-wrap: wrap; }

  footer.app-footer {
    margin-top: 30px;
    text-align: center;
    font-size: 11.5px;
    color: var(--ink-soft);
  }
  footer.app-footer button {
    background: none; border: none; text-decoration: underline; color: var(--ink-soft);
    font-size: 11.5px; cursor: pointer; font-family: inherit;
  }

  @media (max-width: 420px) {
    .mode-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

      {
        id: "geoterms", name: "Geography Terms", num: "Category 4",
        desc: "Map skills, latitude and longitude, the five themes, climate zones, population, culture, economic systems, governments, and resources.",
        flashcards: [
          { id:"geoterms-f1", term:"Latitude lines (parallels)", def:"Imaginary lines that circle the Earth parallel to the Equator, used to measure distance north or south of the Equator in degrees." },
          { id:"geoterms-f2", term:"Longitude lines (meridians)", def:"Imaginary lines running from pole to pole, used to measure distance east or west of the Prime Meridian in degrees." },
          { id:"geoterms-f3", term:"Prime Meridian", def:"The 0-degree line of longitude running through Greenwich, England, from which east and west longitude are measured." },
          { id:"geoterms-f4", term:"Equator", def:"The imaginary line circling the globe at its widest point, dividing Earth into two hemispheres; the reference point for north and south latitude." },
          { id:"geoterms-f5", term:"Degrees and minutes", def:"Latitude and longitude are measured in degrees; a minute is 1/60 of a degree." },
          { id:"geoterms-f6", term:"Absolute vs. relative location", def:"Absolute location is a place's exact position on Earth; relative location describes it by the places near it." },
          { id:"geoterms-f7", term:"Five themes of geography", def:"Location, place (physical and human features), human-environment interaction, movement (how people, goods, and ideas travel), and region (an area with a unifying characteristic)." },
          { id:"geoterms-f8", term:"Map scale and distortion", def:"Scale is the size of an area on a map compared with its actual size; distortion is a misrepresentation of true shape, and every map projection produces some." },
          { id:"geoterms-f9", term:"Compass rose and directions", def:"A map feature showing the four cardinal directions (north, south, east, west); intermediate directions fall between them (NE, NW, SE, SW)." },
          { id:"geoterms-f10", term:"Key (legend)", def:"The section of a map that explains the symbols used for map features." },
          { id:"geoterms-f11", term:"Revolution vs. rotation", def:"A revolution is one complete orbit of Earth around the sun (365\u00bc days); a rotation is one spin of Earth on its axis (about 24 hours)." },
          { id:"geoterms-f12", term:"Low, middle, and high latitudes", def:"Low latitudes (tropics) lie between the Tropics of Cancer and Capricorn; middle latitudes (temperate zones) lie between the tropics and the polar circles; high latitudes (polar zones) lie between the Arctic/Antarctic Circles and the poles." },
          { id:"geoterms-f13", term:"Plate tectonics", def:"The theory that Earth's crust is made of huge, slowly moving slabs of rock called plates." },
          { id:"geoterms-f14", term:"Weathering vs. erosion", def:"Weathering is the breaking down of rocks by wind, rain, or ice; erosion is the wearing away of landforms and carrying of material to another place." },
          { id:"geoterms-f15", term:"Weather vs. climate", def:"Weather is the condition of the lower atmosphere in one place over a short time; climate is the weather patterns an area typically experiences over a long period." },
          { id:"geoterms-f16", term:"Vertical climate", def:"Weather patterns influenced by elevation; the higher the elevation, the colder the climate." },
          { id:"geoterms-f17", term:"Tropical climate", def:"Warm year-round with distinct wet and dry seasons; found between the Tropics of Cancer and Capricorn, including rainforests and savannas." },
          { id:"geoterms-f18", term:"Arid climate", def:"Receives less than 10 inches (250 mm) of precipitation a year; deserts with hot days, cool nights, and sparse vegetation." },
          { id:"geoterms-f19", term:"Tundra climate", def:"A cold, treeless biome with a short growing season, permafrost, and only mosses, lichens, and small shrubs; found in polar regions and high elevations." },
          { id:"geoterms-f20", term:"Mediterranean climate", def:"Hot, dry summers and mild, wet winters; found around the Mediterranean Sea and in parts of California, Chile, South Africa, and Australia." },
          { id:"geoterms-f21", term:"Humid subtropical climate", def:"Hot, humid summers and mild to cool winters; typically on the east coasts of continents, prone to thunderstorms and occasional hurricanes." },
          { id:"geoterms-f22", term:"Subarctic and ice cap climates", def:"Subarctic: long, very cold winters covered by boreal forest (taiga). Ice cap: ground permanently covered by ice and snow, as in Antarctica and Greenland." },
          { id:"geoterms-f23", term:"Population density and distribution", def:"Density is the average number of people in a given area (often a square mile); distribution is how a population is spread over an area." },
          { id:"geoterms-f24", term:"Birth rate and death rate", def:"The number of live births, or deaths, each year per 1,000 people." },
          { id:"geoterms-f25", term:"Push-pull theory", def:"The idea that people migrate because things in their lives \"push\" them to leave and things in a new place \"pull\" them there." },
          { id:"geoterms-f26", term:"Urbanization", def:"The growth of city populations caused by the movement of people to cities; urban areas have high population density, rural areas low, and suburban areas are residential zones near cities." },
          { id:"geoterms-f27", term:"Nuclear vs. extended family", def:"A nuclear family includes parents and children; an extended family may include grandparents, aunts, uncles, and cousins living with or near each other." },
          { id:"geoterms-f28", term:"Cultural diffusion vs. acculturation", def:"Diffusion is the movement of customs and ideas from one culture to another; acculturation is the process of accepting, borrowing, and exchanging ideas among cultures." },
          { id:"geoterms-f29", term:"Producer, consumer, goods, services", def:"A producer makes products others use; a consumer buys goods or services; goods are products that are made; services are work done for other people." },
          { id:"geoterms-f30", term:"Capitalism (market economy)", def:"An economic system in which people and privately owned companies own basic and non-basic businesses, and buyers and sellers make production decisions." },
          { id:"geoterms-f31", term:"Socialism (mixed economy)", def:"An economic system in which the government owns basic industries such as transportation and banking while non-basic industries are privately owned." },
          { id:"geoterms-f32", term:"Communism (command economy)", def:"A system in which a central government owns all basic and non-basic industries and makes all decisions about production and consumption." },
          { id:"geoterms-f33", term:"Direct vs. representative democracy", def:"In a direct democracy people participate directly in decisions; in a representative democracy (republic) people elect representatives to run the country." },
          { id:"geoterms-f34", term:"Monarchy and constitutional monarchy", def:"A monarchy is headed by a king or queen who inherits the throne; in a constitutional monarchy the monarch is head of state with limited powers, as in the U.K." },
          { id:"geoterms-f35", term:"Dictatorship and theocracy", def:"In a dictatorship leaders have complete power and are not answerable to the people; a theocracy is headed by religious leaders who claim to rule by divine authority." },
          { id:"geoterms-f36", term:"Renewable vs. nonrenewable resources", def:"Renewable resources like timber and fish can be regenerated if used carefully; nonrenewable resources like oil, coal, and minerals cannot be replaced once used." },
          { id:"geoterms-f37", term:"Fossil fuel", def:"A nonrenewable resource such as coal, oil, or natural gas, created from the remains of plants and animals." },
          { id:"geoterms-f38", term:"Developed vs. developing nation", def:"A developed nation has a modern industrial society and well-developed economy; a developing nation has low industrial production and often lacks modern technology." },
          { id:"geoterms-f39", term:"Commercial vs. subsistence farming", def:"Commercial farming is large-scale, done by companies for sale in outside markets; subsistence farming provides only enough for a family or village." },
          { id:"geoterms-f40", term:"Imperialism, colonialism, nationalism", def:"Imperialism is one country controlling another's economic and political life; colonialism is extending control over foreign territory for economic benefit; nationalism is pride in one's homeland." }
        ],
        quiz: [

      {
        id: "civ1", name: "River Valleys, India & China", num: "Category 5",
        desc: "The Yellow River valley and early Chinese dynasties from Xia to Han; the Indus Valley, Vedic period, Maurya and Gupta empires, and the caste system.",
        flashcards: [
          { id:"civ1-f1", term:"Yellow River Valley civilization", def:"Grew along the Huang He, growing millet, wheat, and barley; built elaborate canals and dikes to manage flooding, traded as far as Mesopotamia, and declined around 1900 BCE." },
          { id:"civ1-f2", term:"Xia Dynasty (c. 2070-1600 BCE)", def:"Legendary first dynasty founded by Yu the Great after he managed the Yellow River's flooding; known through texts like the Bamboo Annals and still debated by historians." },
          { id:"civ1-f3", term:"Shang Dynasty (c. 1600-1046 BCE)", def:"Founded by King Tang; known for advanced bronze metallurgy, oracle bone script, and a feudal society; notable rulers Wu Ding and the final ruler Di Xin." },
          { id:"civ1-f4", term:"Western Zhou Dynasty (c. 1046-771 BCE)", def:"Kings Wen, Wu, and Cheng expanded the Zhou state, consolidated feudal power, and established the concept of the Mandate of Heaven." },
          { id:"civ1-f5", term:"Mandate of Heaven", def:"The Zhou idea that heaven grants a dynasty the right to rule and can withdraw it from unjust rulers." },
          { id:"civ1-f6", term:"Eastern Zhou Dynasty (c. 770-256 BCE)", def:"Divided into the Spring and Autumn Period (770-476 BCE) and the Warring States Period (476-221 BCE); saw the rise of Confucianism, Taoism, and Legalism." },
          { id:"civ1-f7", term:"The Analects and the Tao Te Ching", def:"Foundational texts of Confucianism and Taoism, respectively, both produced during the Eastern Zhou period." },
          { id:"civ1-f8", term:"Qin Dynasty (221-206 BCE)", def:"Qin Shi Huang, the First Emperor, unified China, standardized writing, and created the first Chinese empire; the Terracotta Army was built to protect him in the afterlife." },
          { id:"civ1-f9", term:"Han Dynasty (206 BCE-220 CE)", def:"Established Silk Road trade, made Confucianism the state ideology, and created the civil service system; Emperor Wu was its greatest ruler and Guangwu founded the Eastern Han." },
          { id:"civ1-f10", term:"Fall of the Han", def:"The Han collapsed after the Yellow Turban Rebellion, giving way to the Three Kingdoms period (Wei, Shu, and Wu) and then the Jin Dynasty." },
          { id:"civ1-f11", term:"Indus Valley Civilization (c. 3300-1300 BCE)", def:"Early urban society whose cities, Mohenjo-Daro and Harappa, had grid-like streets and advanced drainage and sewage systems." },
          { id:"civ1-f12", term:"Indus Valley script", def:"The writing system of the Indus Valley Civilization, which remains undeciphered to this day." },
          { id:"civ1-f13", term:"Vedic Period (c. 1500-500 BCE)", def:"Saw the writing of the Vedas, India's Iron Age, and the introduction of the caste system, which still persists today." },
          { id:"civ1-f14", term:"Religions of the Vedic Period", def:"Hinduism, Buddhism, and Jainism began to take shape; Siddhartha Gautama founded Buddhism and Mahavira established Jainism." },
          { id:"civ1-f15", term:"Maurya Empire (c. 322-185 BCE)", def:"Founded by Chandragupta Maurya and expanded under his grandson Ashoka the Great; traded along the Silk Road." },
          { id:"civ1-f16", term:"Ashoka the Great", def:"Embraced Buddhist non-violence after the bloody Kalinga War and spread the message of dharma (the wheel of law) on stone pillars across his empire." },
          { id:"civ1-f17", term:"End of the Maurya Empire", def:"The last ruler, Brihadratha, was assassinated by his general Pushyamitra Shunga, who founded the Shunga Dynasty." },
          { id:"civ1-f18", term:"Gupta Empire (c. 320-550 CE)", def:"Known as the \"Golden Age of India\"; notable rulers were Chandragupta I, Samudragupta, and Chandragupta II." },
          { id:"civ1-f19", term:"Gupta achievements", def:"Developed the decimal numeral system and the concept of zero; the Mahabharata and Ramayana were canonized; the Indian Ocean trade network began." },
          { id:"civ1-f20", term:"Indian caste system (top to bottom)", def:"Brahmins (priests), Kshatriyas (kings, rulers, warriors), Vaisyas (merchants, craftsmen, landowners), Sudras (farm workers, servants), and Dalits (\"untouchables\")." },
          { id:"civ1-f21", term:"Brahmins", def:"The priestly caste at the top of the Indian caste system." },
          { id:"civ1-f22", term:"Dalits", def:"The \"untouchables,\" outcastes below the four main castes who did jobs like street sweeping and handling the dead." }

      {
        id: "civ2", name: "Ancient Africa, Egypt, Greece & Rome", num: "Category 6",
        desc: "Prehistoric and Bronze Age Europe, Greek city-states and Alexander, the Roman Kingdom, Republic, and Empire, and the kingdoms and pharaohs of Egypt.",
        flashcards: [
          { id:"civ2-f1", term:"Stone Ages of Europe", def:"Paleolithic (Old Stone Age: stone tools, cave paintings, Venus figurines), Mesolithic (pottery, bows, canoes, early domestication), and Neolithic (farming and settlements)." },
          { id:"civ2-f2", term:"Chalcolithic (Copper) Age", def:"Brought the first copper tools and weapons; the Varna culture of modern Bulgaria developed gold metallurgy, and Stonehenge was erected." },
          { id:"civ2-f3", term:"Minoan civilization", def:"A Bronze Age civilization on Crete known for multistory palaces, colorful frescoes, \"bull-leaping,\" and two scripts, Linear A (undeciphered) and Linear B (mostly deciphered)." },
          { id:"civ2-f4", term:"Palace at Knossos", def:"The best-known Minoan settlement, home of the legendary King Minos and the labyrinth of Greek myth." },
          { id:"civ2-f5", term:"Mycenaean civilization", def:"A Bronze Age Greek civilization closer to Classical Greece; its chief city, Mycenae, is famous for the Lion Gate at the entrance to its acropolis." },
          { id:"civ2-f6", term:"Sea Peoples", def:"Mysterious invaders whose attacks, along with drought and natural disasters, helped end the Bronze Age in the Mediterranean world." },
          { id:"civ2-f7", term:"Start of Classical Greece", def:"Marked by the first Olympic Games in 776 BCE; the poet Homer is believed to have lived in this period." },
          { id:"civ2-f8", term:"Polis and hoplite", def:"The polis was the Greek city-state; the hoplite was the heavily armed citizen-soldier at the core of Greek armies, fighting in a phalanx." },
          { id:"civ2-f9", term:"Draco", def:"In 621 BCE replaced Athens' oral law with a harsh written code \u2014 debtors were enslaved and minor crimes drew death \u2014 giving us the word \"draconian.\"" },
          { id:"civ2-f10", term:"Solon", def:"Athenian archon from 594 BCE called \"the Lawgiver\"; balanced power between rich and poor by ranking citizens into four wealth classes and allowing appeals to an assembly." },
          { id:"civ2-f11", term:"Cleisthenes", def:"Athenian archon who expanded direct democracy and introduced ostracism, by which a citizen could be expelled from Athens by majority vote." },
          { id:"civ2-f12", term:"Lycurgus and Sparta", def:"Lycurgus created Sparta's dual monarchy with a council of elders; Sparta trained boys for war from a young age and enslaved the neighboring Messenians as helots." },
          { id:"civ2-f13", term:"Peloponnesian League", def:"A military alliance led by Sparta that included Corinth, Thebes, and Delphi." },
          { id:"civ2-f14", term:"First Persian War", def:"Darius I's invasion ended with Persia's defeat by a small Athenian force at the Battle of Marathon in 490 BCE." },
          { id:"civ2-f15", term:"Second Persian War", def:"Xerxes I's invasion (481-479 BCE) was held back by Athens under Themistocles and by Leonidas's 300 Spartans at the Battle of Thermopylae." },
          { id:"civ2-f16", term:"Delian League and Pericles", def:"Athens formed the Delian League after the Persian Wars; Pericles expanded democracy and the arts, began the Acropolis and Parthenon, and died in the plague of 429 BCE." },
          { id:"civ2-f17", term:"Peloponnesian War (431-404 BCE)", def:"Fought between Athens' Delian League and Sparta's Peloponnesian League; Sparta won, leading to the rule of the Thirty Tyrants in Athens." },
          { id:"civ2-f18", term:"Alexander the Great", def:"Son of Philip II of Macedon; undefeated in battle, he conquered the Persian (Achaemenid) Empire and reached India between 336 and his death in 323 BCE, founding Alexandria in Egypt." },
          { id:"civ2-f19", term:"Successor kingdoms", def:"After Alexander's death his empire split into the Antigonid Kingdom, the Ptolemaic Kingdom (Egypt), and the Seleucid Empire; this Hellenistic world was later absorbed by Rome." },
          { id:"civ2-f20", term:"Roman Kingdom (c. 753-509 BCE)", def:"Founded by Romulus and Remus, twins raised by a she-wolf; seven kings ruled until the tyrant Tarquin the Proud was exiled in 509 BCE." },
          { id:"civ2-f21", term:"Roman Republic government", def:"Two consuls elected by the people, a Senate of patricians serving for life, and tribunes elected by the plebeians who could veto the consuls and Senate." },
          { id:"civ2-f22", term:"Patricians and plebeians", def:"The two classes of Roman society: wealthy landowning patricians and the poorer plebeians." },
          { id:"civ2-f23", term:"Cincinnatus", def:"The first Roman dictator, appointed in a crisis during the Aequian War." },
          { id:"civ2-f24", term:"Twelve Tables (449 BCE)", def:"Rome's first codified laws, displayed on copper tablets covering court procedure, family rights, inheritance, property, injury, and public and sacred law." },
          { id:"civ2-f25", term:"First Triumvirate", def:"The political alliance of Pompey, Julius Caesar, and Crassus." },
          { id:"civ2-f26", term:"Cicero", def:"Roman orator and statesman; consul during the Catiline Conspiracy; opposed Caesar and Mark Antony in speeches and was assassinated in 43 BCE on orders of the Second Triumvirate." },
          { id:"civ2-f27", term:"Julius Caesar", def:"Conquered Gaul, crossed the Rubicon saying \"The die is cast,\" won the civil war to become dictator, and was assassinated on the Ides of March (March 15), 44 BCE (\"Et tu, Brute?\")." },
          { id:"civ2-f28", term:"Punic Wars", def:"Three wars between Rome and Carthage: Rome won Sicily in the First; Hannibal crossed the Alps and won at Cannae before Scipio Africanus beat him at Zama in the Second; Carthage was destroyed in the Third." },
          { id:"civ2-f29", term:"Pyrrhic War (280-275 BCE)", def:"Rome defeated Pyrrhus of Epirus at Heraclea and Asculum but at great cost, giving us the term \"Pyrrhic victory.\"" },
          { id:"civ2-f30", term:"Gallic Wars (58-50 BCE)", def:"Julius Caesar's conquest of the Gallic tribes, ending with the defeat of Vercingetorix at the Siege of Alesia." },
          { id:"civ2-f31", term:"Second Triumvirate", def:"Octavian, Mark Antony, and Marcus Lepidus, who pursued Caesar's assassins; it collapsed into rivalry between Octavian and Antony." },
          { id:"civ2-f32", term:"Battle of Actium (31 BCE)", def:"Octavian defeated Mark Antony and Cleopatra; after a final defeat at Alexandria in 30 BCE, Antony and Cleopatra died by suicide." },
          { id:"civ2-f33", term:"Augustus and the Pax Romana", def:"Octavian took the title Augustus, became the first Roman emperor (27 BCE-14 CE), and began a period of relative peace known as the Pax Romana." },
          { id:"civ2-f34", term:"Battle of Teutoburg Forest (9 CE)", def:"Germanic tribes destroyed three legions under Varus; Augustus reportedly cried, \"Quinctilius Varus, give me back my legions!\"" },
          { id:"civ2-f35", term:"Caligula and Claudius", def:"Caligula (\"little boot\") tried to make his horse Incitatus a consul and was assassinated; Claudius, found hiding behind a curtain afterward, went on to conquer Britain." },
          { id:"civ2-f36", term:"Nero", def:"Last emperor of the Julio-Claudian dynasty; known for the Great Fire of Rome and persecution of Christians." },
          { id:"civ2-f37", term:"Vespasian and Titus", def:"Vespasian began construction of the Colosseum; his son Titus completed it." },
          { id:"civ2-f38", term:"Trajan and Hadrian", def:"Trajan expanded the empire to its greatest extent (98-117 CE); Hadrian built Hadrian's Wall in Britain (117-138 CE)." },
          { id:"civ2-f39", term:"Marcus Aurelius", def:"Stoic philosopher-emperor who wrote Meditations and fought the Marcomannic Wars; the last of the Five Good Emperors (161-180 CE)." },
          { id:"civ2-f40", term:"Commodus and Caracalla", def:"Commodus dressed as Hercules and fought as a gladiator; Caracalla granted citizenship to all free inhabitants and built huge public baths." },
          { id:"civ2-f41", term:"Diocletian", def:"Split the Roman Empire into Eastern and Western halves (284-305 CE)." },
          { id:"civ2-f42", term:"Constantine the Great", def:"Legalized Christianity after seeing a Chi Rho vision before the Battle of Milvian Bridge (312 CE), founded Constantinople, and called the Council of Nicaea in 325, which produced the Nicene Creed." },
          { id:"civ2-f43", term:"Theodosius the Great", def:"Made Christianity the official state religion of the Roman Empire (379-395 CE)." },
          { id:"civ2-f44", term:"Fall of the Western Empire", def:"Rome was sacked by the Visigoths under Alaric (410) and the Vandals under Genseric (455); the last Western emperor, Romulus Augustulus, was deposed by Odoacer in 476." },
          { id:"civ2-f45", term:"Battle of the Catalaunian Plains (451 CE)", def:"Roman and barbarian forces halted Attila the Hun's invasion of Gaul." },
          { id:"civ2-f46", term:"Old Kingdom of Egypt (c. 2686-2181 BCE)", def:"Era of the Great Pyramids at Giza and a strong centralized state, with its capital at Memphis." },
          { id:"civ2-f47", term:"Middle Kingdom of Egypt (c. 2055-1650 BCE)", def:"Reestablished central authority and expanded trade; the capital shifted to Thebes; followed by the Hyksos invasion of the Second Intermediate Period." },
          { id:"civ2-f48", term:"New Kingdom of Egypt (c. 1550-1070 BCE)", def:"Egypt's imperial age and the first use of the title \"pharaoh\"; began when Ahmose the Great drove out the Hyksos and founded the 18th Dynasty." },
          { id:"civ2-f49", term:"Hatshepsut", def:"One of the few female pharaohs (1479-1458 BCE); focused on trade expeditions and built the temple at Deir el-Bahri." },
          { id:"civ2-f50", term:"Thutmose III", def:"The \"Napoleon of Egypt\"; expanded the empire through campaigns in Canaan and Nubia, won at Megiddo, and built at the Great Temple of Karnak." },
          { id:"civ2-f51", term:"Akhenaten", def:"Formerly Amenhotep IV; made the sun god Aten the state god, moved the capital to Amarna, and changed Egyptian religious and artistic conventions." },
          { id:"civ2-f52", term:"Tutankhamun", def:"Took the throne as a boy and reversed Akhenaten's religious reforms; famous for his intact tomb in the Valley of the Kings." },
          { id:"civ2-f53", term:"Ramesses II (Ramses the Great)", def:"Ruled 1279-1213 BCE; built Abu Simbel, fought the Hittites at the Battle of Kadesh and signed the first known peace treaty; called Ozymandias in Greek texts." },
          { id:"civ2-f54", term:"Merneptah", def:"Ramesses II's successor; fought the Sea Peoples and left the earliest known reference to Israel." },
          { id:"civ2-f55", term:"Late and Greco-Roman Egypt", def:"Egypt fell under Persian and then Greek rule; after Alexander's conquest the Ptolemaic dynasty ruled until Cleopatra VII's alliances with Caesar and Mark Antony ended in Roman annexation." }

        flashcards: [
          { id:"matter-f1", term:"Democritus", def:"Ancient Greek philosopher who proposed matter was made of indivisible units he called \"atomos\" (Greek for \"indivisible\")." },
          { id:"matter-f2", term:"John Dalton", def:"English scientist whose 1808 atomic theory proposed atoms as indivisible, indestructible units; elements are made of only one type of atom." },
          { id:"matter-f3", term:"J.J. Thomson", def:"British physicist who discovered the electron in his 1897 cathode ray tube experiment and proposed the \"Plum Pudding\" model of the atom." },
          { id:"matter-f4", term:"Ernest Rutherford", def:"New Zealand physicist whose 1909 Gold Foil Experiment (performed by students Geiger and Marsden) proved electrons orbit a small, dense, positive nucleus." },
          { id:"matter-f5", term:"James Chadwick", def:"Discovered the neutron in 1932, completing the basic model of the atomic nucleus." },
          { id:"matter-f6", term:"Niels Bohr", def:"Danish physicist who, in 1913, proposed the \"planetary\" model in which electrons orbit the nucleus in fixed, discrete energy levels." },
          { id:"matter-f7", term:"Quantum Model", def:"The modern atomic model, describing electrons as occupying probabilistic \"electron clouds\" rather than fixed orbits." },
          { id:"matter-f8", term:"Boyle's Law", def:"States that the volume of a gas is inversely proportional to its pressure when temperature is constant." },
          { id:"matter-f9", term:"Charles's Law", def:"States that the volume of a gas is directly proportional to its temperature when pressure is constant." },
          { id:"matter-f10", term:"Plasma", def:"The fourth state of matter, formed when electrons are stripped from atoms; found naturally in lightning and stars, and artificially in plasma TVs and neon lights." },
          { id:"matter-f11", term:"Bose-Einstein Condensate", def:"An exotic state of matter first proposed by Einstein in 1924 and created in 1995 by Eric Cornell and Carl Wieman by supercooling rubidium atoms near absolute zero." },
          { id:"matter-f12", term:"Dmitri Mendeleev", def:"Developed the first practical periodic table in 1869, arranged by atomic weight, leaving gaps for undiscovered elements." },
          { id:"matter-f13", term:"Henry Moseley", def:"Reorganized the periodic table by atomic number in 1913, the arrangement still used today." },
          { id:"matter-f14", term:"Periodic table groups", def:"Group 1 (Alkali Metals), Group 2 (Alkaline Earth Metals), Groups 3-12 (Transition Metals), Group 17 (Halogens), and Group 18 (Noble Gases)." },
          { id:"matter-f15", term:"Atomic Number vs. Atomic Weight", def:"The Atomic Number (Z) is the number of protons; the Atomic Weight is the average mass of all isotopes of an element, so it is rarely a whole number." },
          { id:"matter-f16", term:"Ionic bond", def:"Forms when one atom transfers valence electrons to another, creating an attraction between a positive cation and a negative anion." },
          { id:"matter-f17", term:"Covalent bond", def:"Forms when two or more atoms share valence electrons, creating a molecule; sharing two or three electron pairs creates double or triple bonds." },
          { id:"matter-f18", term:"Synthesis reaction", def:"A chemical reaction in which two or more substances combine to form a single product, such as 2H2 + O2 \u2192 2H2O." },
          { id:"matter-f19", term:"Decomposition reaction", def:"A chemical reaction in which a single compound breaks down into two or more simpler products, such as CaCO3 \u2192 CaO + CO2." },
          { id:"matter-f20", term:"Single replacement reaction", def:"Also called single displacement; one element substitutes for another within a compound, as in Zn + CuCl2 \u2192 Cu + ZnCl2." },
          { id:"matter-f21", term:"Double replacement reaction", def:"Also called double displacement or a precipitation reaction; two compounds exchange components, as in HCl + NaOH \u2192 H2O + NaCl." },
          { id:"matter-f22", term:"Homogeneous vs. heterogeneous mixtures", def:"A homogeneous mixture (like saltwater) has uniformly dispersed components; a heterogeneous mixture (like a pizza) has unevenly distributed components." },
          { id:"matter-f23", term:"Suspension", def:"A mixture with large dispersed particles (like muddy water) that settle over time and scatter light, producing the Tyndall Effect." },
          { id:"matter-f24", term:"Colloid", def:"A mixture with medium-sized particles (like milk or blood plasma) that do not settle over time but still scatter light, showing the Tyndall Effect." },
          { id:"matter-f25", term:"Solution", def:"A mixture with particles so small they neither settle nor scatter light; made of a solute (dissolved substance) and a solvent (the dissolving medium)." },
          { id:"matter-f26", term:"Isotopes", def:"Atoms of the same element with different numbers of neutrons, giving them different atomic weights but identical chemical properties." },
          { id:"matter-f27", term:"Carbon-14", def:"A radioisotope making up about one-trillionth of all carbon, with a half-life of 5,730 years, useful for radiometric dating of old fossils." },
          { id:"matter-f28", term:"Uranium-235", def:"The only naturally occurring uranium isotope capable of nuclear fission, making it the fissile material used in nuclear reactors." },
          { id:"matter-f29", term:"Cations and anions", def:"Cations (like Na\u207a and Ca\u00b2\u207a) are positively charged ions formed when metals lose electrons; anions (like Cl\u207b and O\u00b2\u207b) are negatively charged ions formed when nonmetals gain electrons." },
          { id:"matter-f30", term:"Polyatomic ions", def:"Bonded groups of two or more atoms that act as a single charged unit, such as hydroxide (OH\u207b), nitrate (NO3\u207b), and carbonate (CO3\u00b2\u207b)." }

      {
        id: "motionforce", name: "Motion & Force", num: "Category 2",
        desc: "Newton's Laws, waves, speed/velocity/acceleration, projectile motion, circular motion, gravity, friction, and momentum.",
        flashcards: [
          { id:"motionforce-f1", term:"The Principia", def:"Isaac Newton's 1687 work, Philosophiae Naturalis Principia Mathematica, in which he first presented his three Laws of Motion and the Law of Universal Gravitation." },
          { id:"motionforce-f2", term:"Newton's First Law", def:"An object at rest or in uniform motion stays that way unless acted on by an external force; also called the Law of Inertia." },
          { id:"motionforce-f3", term:"Newton's Second Law", def:"The change in an object's motion is proportional to the force applied to it; commonly written as F = ma (force = mass \u00d7 acceleration)." },
          { id:"motionforce-f4", term:"Newton's Third Law", def:"For every force, there is an equal and opposite force; better phrased with \"force\" than the oversimplified \"action/reaction.\"" },
          { id:"motionforce-f5", term:"Inertia", def:"The tendency of an object to resist changes in its state of motion; the greater an object's mass, the greater its inertia." },
          { id:"motionforce-f6", term:"Transverse wave", def:"A wave that oscillates perpendicular to its direction of travel, such as electromagnetic waves, water ripples, seismic S-waves, and vibrating strings." },
          { id:"motionforce-f7", term:"Transverse wave parts", def:"Crest (maximum positive displacement), trough (maximum negative displacement), amplitude (max displacement from equilibrium), and wavelength (distance between matching points)." },
          { id:"motionforce-f8", term:"Speed vs. Velocity", def:"Speed is a scalar quantity (magnitude only); velocity is a vector quantity (magnitude and direction) \u2014 essentially \"speed with direction.\"" },
          { id:"motionforce-f9", term:"Acceleration", def:"The rate of change of velocity over time; like velocity, it is a vector quantity, positive when speeding up and negative when slowing down." },
          { id:"motionforce-f10", term:"Longitudinal wave", def:"A wave that displaces its medium in the same direction it travels, producing regions of compression and rarefaction; also called a compression wave." },
          { id:"motionforce-f11", term:"Longitudinal wave examples", def:"Sound waves and seismic P-waves are longitudinal; because they require a medium, sound cannot travel through the vacuum of space." },
          { id:"motionforce-f12", term:"Projectile motion", def:"The motion of an object launched into the air and affected only by gravity; horizontal motion involves velocity, vertical motion involves acceleration due to gravity." },
          { id:"motionforce-f13", term:"Angle of launch", def:"A 45-degree launch angle produces the greatest horizontal distance for a projectile; launches at 30 and 60 degrees produce equal (but shorter) distances." },
          { id:"motionforce-f14", term:"Centripetal force", def:"The real inward force (often tension) that keeps an object moving along a circular path, such as the Sun's gravity keeping planets in orbit." },
          { id:"motionforce-f15", term:"Centrifugal force", def:"An apparent, fictitious outward force felt due to inertia during circular motion; not a real force, unlike centripetal force." },
          { id:"motionforce-f16", term:"Gravity and mass", def:"Gravitational force is proportional to an object's mass and decreases as distance between objects increases, per Newton's Law of Universal Gravitation." },
          { id:"motionforce-f17", term:"Gravity on the Moon", def:"The Moon's gravity is about 1/6th that of Earth's, meaning astronauts (and their jumps) are much lighter there." },
          { id:"motionforce-f18", term:"Coefficient of friction", def:"A ratio describing the frictional force between two surfaces relative to the force pressing them together; Teflon has one of the lowest known values." },
          { id:"motionforce-f19", term:"Static vs. sliding friction", def:"Static friction resists the start of motion between non-moving objects and has a higher coefficient than sliding (kinetic) friction, which acts between objects already moving." },
          { id:"motionforce-f20", term:"Momentum", def:"The product of an object's mass and velocity, measured in kg\u00b7m/s; conserved in a closed system, such as during a collision." }
        ],
        quiz: [

          { id:"motionforce-q5", q:"On a transverse wave, the maximum positive displacement is called the:", opts:["Trough","Crest","Amplitude","Wavelength"], correct:1 },

          { id:"motionforce-q7", q:"Longitudinal waves, like sound, cannot travel through:", opts:["Water","Air","The vacuum of space","Solids"], correct:2 },
          { id:"motionforce-q8", q:"At what launch angle does a projectile achieve the greatest horizontal displacement?", opts:["30 degrees","45 degrees","60 degrees","90 degrees"], correct:1 },
          { id:"motionforce-q9", q:"What is the real inward force that keeps an object moving in a circular path called?", opts:["Centrifugal force","Gravitational force","Centripetal force","Normal force"], correct:2 },
          { id:"motionforce-q10", q:"Centrifugal force is best described as:", opts:["A fundamental force of nature","An apparent/fictitious force due to inertia","The same thing as gravity","A force that only exists in space"], correct:1 },
          { id:"motionforce-q11", q:"The Moon's gravitational force is approximately what fraction of Earth's?", opts:["1/2","1/3","1/6","1/10"], correct:2 },
          { id:"motionforce-q12", q:"Which type of friction occurs between two objects that are not moving relative to one another?", opts:["Sliding friction","Kinetic friction","Static friction","Rolling friction"], correct:2 },
          { id:"motionforce-q13", q:"Momentum is the product of an object's:", opts:["Mass and acceleration","Mass and velocity","Force and distance","Force and time"], correct:1 },
          { id:"motionforce-q14", q:"In a closed system during a collision, momentum is:", opts:["Always increased","Always decreased","Conserved","Converted entirely to heat"], correct:2 }
        ]
      },
      {
        id: "energy", name: "Transfer of Energy", num: "Category 3",
        desc: "Heat transfer, the electromagnetic spectrum, kinetic and potential energy, temperature scales, electricity, and thermodynamics.",
        flashcards: [
          { id:"energy-f1", term:"Thermal conduction", def:"Heat transfer that occurs through direct contact between objects or areas of an object." },
          { id:"energy-f2", term:"Thermal convection", def:"Heat transfer through the movement of a fluid (liquid or gas), such as rising hot air." },
          { id:"energy-f3", term:"Thermal radiation", def:"Heat transfer via electromagnetic waves; unlike conduction and convection, it can occur through a vacuum." },
          { id:"energy-f4", term:"Electromagnetic spectrum order", def:"From shortest to longest wavelength: gamma rays, X-rays, ultraviolet, visible light, infrared, microwaves, radio waves." },
          { id:"energy-f5", term:"Wilhelm R\u00f6ntgen", def:"Discovered and named X-rays in 1895; won the first Nobel Prize in Physics in 1901 for the discovery." },
          { id:"energy-f6", term:"Isaac Newton (light)", def:"In 1665, showed that white light passing through a prism splits into the seven colors of the visible spectrum." },
          { id:"energy-f7", term:"Gravitational potential energy", def:"Stored energy an object possesses due to its position within a gravitational field." },
          { id:"energy-f8", term:"Kinetic energy", def:"Energy due to motion; proportional to the square of an object's velocity." },
          { id:"energy-f9", term:"Fahrenheit scale", def:"Developed in 1724 by Daniel Fahrenheit; sets water's freezing point at 32\u00b0F and boiling point at 212\u00b0F." },
          { id:"energy-f10", term:"Celsius scale", def:"Sets water's freezing point at 0\u00b0C and boiling point at 100\u00b0C; the SI system's preferred temperature unit." },
          { id:"energy-f11", term:"Kelvin scale", def:"An absolute temperature scale based on absolute zero (0 K), the point at which all atomic motion stops." },
          { id:"energy-f12", term:"Ohm's Law", def:"Describes the relationship between voltage, current, and resistance in an electric circuit." },
          { id:"energy-f13", term:"Series circuit", def:"An electrical circuit with components connected end-to-end; a break anywhere stops the whole circuit." },
          { id:"energy-f14", term:"Parallel circuit", def:"An electrical circuit with components connected along separate branches; a break in one branch doesn't stop the others." },
          { id:"energy-f15", term:"First Law of Thermodynamics", def:"Energy cannot be created or destroyed, only transformed from one form to another." },
          { id:"energy-f16", term:"Second Law of Thermodynamics", def:"States that heat cannot spontaneously flow from a cooler body to a warmer one, and that entropy in the universe always increases." },
          { id:"energy-f17", term:"Entropy", def:"A measure of the disorder or randomness of a system." },
          { id:"energy-f18", term:"Refraction", def:"The bending of light as it passes from one medium to another with a different density." },
          { id:"energy-f19", term:"Reflection", def:"The bouncing back of light (or another wave) when it hits a surface rather than passing through it." },
          { id:"energy-f20", term:"Conductors vs. insulators", def:"Conductors (like metals) allow heat and electricity to flow through them easily; insulators (like rubber and wood) resist that flow." }
        ],
        quiz: [

          { id:"energy-q2", q:"Which method of heat transfer can occur through the vacuum of space?", opts:["Conduction","Convection","Radiation","Diffusion"], correct:2 },
          { id:"energy-q3", q:"Which type of electromagnetic radiation has the shortest wavelength and highest energy?", opts:["Radio waves","Visible light","Gamma rays","Infrared"], correct:2 },
          { id:"energy-q4", q:"Who discovered X-rays in 1895 and was awarded the first Nobel Prize in Physics for it?", opts:["Isaac Newton","Wilhelm R\u00f6ntgen","Nikola Tesla","Heinrich Hertz"], correct:1 },
          { id:"energy-q5", q:"Kinetic energy is proportional to which quantity, squared?", opts:["Mass","Velocity","Distance","Time"], correct:1 },
          { id:"energy-q6", q:"On the Celsius scale, what is the boiling point of water?", opts:["32 degrees","100 degrees","212 degrees","273 degrees"], correct:1 },
          { id:"energy-q7", q:"Which SI unit of temperature is based on absolute zero as its starting point?", opts:["Fahrenheit","Celsius","Kelvin","Rankine"], correct:2 },
          { id:"energy-q8", q:"A circuit where components are connected end-to-end, so a single break stops the whole circuit, is called a:", opts:["Parallel circuit","Series circuit","Open circuit","Ohmic circuit"], correct:1 },

          { id:"energy-q10", q:"The Second Law of Thermodynamics states that:", opts:["Energy can be created from nothing","Heat flows spontaneously from cold to hot","Entropy in the universe always increases","Energy is always destroyed"], correct:2 },
          { id:"energy-q11", q:"The bending of light as it passes from one medium into another is called:", opts:["Reflection","Refraction","Diffraction","Dispersion"], correct:1 },
          { id:"energy-q12", q:"Materials like metals, which allow heat and electricity to flow through them easily, are called:", opts:["Insulators","Conductors","Semiconductors","Resistors"], correct:1 }
        ]

      {
        id: "livingsystems", name: "Living Systems' Structure & Function", num: "Category 4",
        desc: "Cell organelles, prokaryotes, the human brain and organ systems, mitosis, cell respiration, and comparative anatomy.",
        flashcards: [
          { id:"livingsystems-f1", term:"Mitochondria", def:"Membrane-bound organelles that perform aerobic respiration to produce ATP; nicknamed \"the powerhouse\" of the cell." },
          { id:"livingsystems-f2", term:"Ribosomes", def:"Organelles made of protein and RNA that assemble a cell's proteins." },
          { id:"livingsystems-f3", term:"Rough vs. Smooth ER", def:"Rough endoplasmic reticulum (covered in ribosomes) transports proteins; smooth ER synthesizes and transports lipids." },
          { id:"livingsystems-f4", term:"Golgi apparatus", def:"Organelle that packages, modifies, and secretes cellular substances into vesicles." },
          { id:"livingsystems-f5", term:"Prokaryotes", def:"Unicellular organisms (bacteria and archaea) that lack a nucleus and membrane-bound organelles." },
          { id:"livingsystems-f6", term:"Bacterial shapes", def:"Cocci are spherical, bacilli are rod-shaped, and spirilla are spiral or corkscrew-shaped." },
          { id:"livingsystems-f7", term:"Medulla oblongata", def:"Brainstem structure nicknamed the \"animal brain\" that controls involuntary vital functions like heart rate and breathing." },
          { id:"livingsystems-f8", term:"Cerebellum", def:"The most posterior part of the brain, responsible for coordinating smooth muscular movement and balance." },

          { id:"livingsystems-f11", term:"Myelin sheath", def:"A fatty coating around some axons that speeds up nerve impulse transmission." },
          { id:"livingsystems-f12", term:"Xylem and Phloem", def:"Plant vascular tissues: xylem transports water upward from the roots, while phloem transports sugars throughout the plant." },

          { id:"livingsystems-f15", term:"Cell respiration", def:"The process of breaking down glucose to release energy stored as ATP, the cell's \"energy currency.\"" },
          { id:"livingsystems-f16", term:"Glycolysis", def:"The initial breakdown of glucose into pyruvate, occurring in the cytosol whether or not oxygen is present." },
          { id:"livingsystems-f17", term:"Comparative vertebrate hearts", def:"Fish have 2 heart chambers, amphibians and most reptiles have 3 (or 3.5), and birds and mammals have 4." },
          { id:"livingsystems-f18", term:"Pituitary gland", def:"Nicknamed the \"master gland\"; secretes hormones including growth hormone and antidiuretic hormone (ADH)." },
          { id:"livingsystems-f19", term:"Cell membrane", def:"The selectively permeable outer boundary of a cell, controlling what substances enter and exit." },
          { id:"livingsystems-f20", term:"Nucleus", def:"The membrane-bound organelle in eukaryotic cells that houses the cell's genetic material (DNA)." },
          { id:"livingsystems-f21", term:"Homeostasis", def:"The tendency of an organism or cell to maintain a stable internal environment despite external changes." },
          { id:"livingsystems-f22", term:"Circulatory system", def:"The organ system, including the heart and blood vessels, that transports blood, oxygen, and nutrients throughout the body." },
          { id:"livingsystems-f23", term:"Respiratory system", def:"The organ system responsible for gas exchange, bringing oxygen into the body and removing carbon dioxide." }

        desc: "Major American and British poets, their signature works, and famous lines, from Poe to Angelou.",
        flashcards: [
          { id:"poets-f1", term:"Edgar Allan Poe (1809-1849)", def:"\"Master of the Macabre\" and creator of the detective story." },
          { id:"poets-f2", term:"\"The Raven\"", def:"Poe's poem in which a talking raven, entering on a December midnight, answers every question about the speaker's dead love Lenore with the word \"Nevermore.\"" },
          { id:"poets-f3", term:"\"Annabel Lee\"", def:"Poe poem in which the speaker mourns his dead bride, blaming jealous angels, and lies down beside her \"in her sepulcher there by the sea.\"" },
          { id:"poets-f4", term:"\"A Dream Within a Dream\"", def:"Poe's meditation on time and loss, asking, \"Is all that we see or seem / But a dream within a dream?\"" },
          { id:"poets-f5", term:"Emily Dickinson (1830-1886)", def:"Known as \"the Lady in White\" or \"the Recluse of Amherst\"; wrote 1,775 poems, found bound in her room after her death." },
          { id:"poets-f6", term:"\"Because I Could Not Stop for Death\"", def:"Dickinson poem in which \"Death kindly stopped\" for the speaker, carrying her in a carriage past fields of gazing grain." },
          { id:"poets-f7", term:"Carl Sandburg (1878-1967)", def:"\"The Chicago Poet\" and \"Bard of the Midwest\"; won three Pulitzer Prizes, one for a Lincoln biography and two for poetry." },
          { id:"poets-f8", term:"\"Fog\" and \"Chicago\"", def:"Sandburg poems: \"Fog\" describes fog that \"comes on little cat feet\"; \"Chicago\" calls the city \"Hog Butcher for the World\" and \"City of the Big Shoulders.\"" },
          { id:"poets-f9", term:"Henry Wadsworth Longfellow (1807-1882)", def:"A \"Fireside Poet\" alongside Lowell, Holmes, and Whittier; translated Dante's Divine Comedy." },

          { id:"poets-f11", term:"\"The Song of Hiawatha\"", def:"Longfellow's epic about Native American hero Hiawatha, raised by Nokomis, who falls in love with Minnehaha (\"Laughing Water\") near Lake Superior." },
          { id:"poets-f12", term:"\"Evangeline\"", def:"Longfellow poem about two lovers, Evangeline and Gabriel, separated when Acadians are forced from Nova Scotia; many settled in Louisiana as the Cajun people." },
          { id:"poets-f13", term:"Robert Frost (1874-1963)", def:"Four-time Pulitzer Prize winner; recited \"The Gift Outright\" at President Kennedy's inauguration." },
          { id:"poets-f14", term:"\"Nothing Gold Can Stay\"", def:"Robert Frost poem featured in S.E. Hinton's The Outsiders, ending \"So dawn goes down to day. / Nothing gold can stay.\"" },
          { id:"poets-f15", term:"\"Mending Wall\"", def:"Frost poem about neighbors repairing a wall while nature works to destroy it, famous for the line \"Good fences make good neighbors.\"" },
          { id:"poets-f16", term:"\"The Death of the Hired Man\"", def:"Frost poem containing the line \"Home is the place where, when you have to go there, / They have to take you in.\"" },
          { id:"poets-f17", term:"Rudyard Kipling (1865-1936)", def:"English writer born in British India; won the 1907 Nobel Prize in Literature; wrote The Jungle Book and the poems \"If\" and \"Gunga Din.\"" },
          { id:"poets-f18", term:"Langston Hughes (1902-1967)", def:"Leading poet of the Harlem Renaissance; wrote \"The Negro Speaks of Rivers\" and \"Harlem\" (\"A Dream Deferred\")." },
          { id:"poets-f19", term:"\"Harlem\" (A Dream Deferred)", def:"Hughes poem asking what happens to a dream deferred, comparing it to a raisin drying in the sun; inspired the title of A Raisin in the Sun." },
          { id:"poets-f20", term:"\"Mother to Son\"", def:"Hughes poem in which a mother tells her son life \"ain't been no crystal stair,\" using stairs as an extended metaphor to encourage him to keep going." },
          { id:"poets-f21", term:"Walt Whitman (1819-1892)", def:"Considered the \"Father of Free Verse\"; wrote Leaves of Grass, which grew from 12 poems in 1855 to 383 by 1892." },

          { id:"poets-f24", term:"Phillis Wheatley (c.1754-1784)", def:"The first published African American poet, brought to America on a slave ship at age eight; published her first collection in 1773 at sixteen." },
          { id:"poets-f25", term:"Maya Angelou (1928-2014)", def:"Poet and author of I Know Why the Caged Bird Sings; recited \"On the Pulse of Morning\" at Bill Clinton's inauguration." },
          { id:"poets-f26", term:"\"Phenomenal Woman\" and \"And Still I Rise\"", def:"Two of Maya Angelou's best-known poems, both centering themes of self-worth, liberation, and survival." },
          { id:"poets-f27", term:"Fireside Poets", def:"A group of popular 19th-century American poets including Longfellow, James Russell Lowell, Oliver Wendell Holmes, and John Greenleaf Whittier." }

        id: "geometry", name: "Geometry: Lines, Angles & Polygons", num: "Category 6",
        desc: "Midpoints and distance, parallel and perpendicular lines, angle relationships, quadrilaterals, and polygon properties.",
        flashcards: [
          { id:"geometry-f1", term:"Midpoint formula", def:"The midpoint of a segment is found by averaging the coordinates of its endpoints." },
          { id:"geometry-f2", term:"Distance formula", def:"Derived from the Pythagorean Theorem: the distance between two points equals \u221a((x2-x1)\u00b2 + (y2-y1)\u00b2)." },
          { id:"geometry-f3", term:"3D distance formula", def:"In three-dimensional space, the distance formula extends to include a z-coordinate: \u221a((x2-x1)\u00b2 + (y2-y1)\u00b2 + (z2-z1)\u00b2)." },
          { id:"geometry-f4", term:"Properties of Equality", def:"Reflexive (A = A), Symmetric (if a = b, then b = a), and Transitive (if a = b and b = c, then a = c)." },
          { id:"geometry-f5", term:"Perpendicular lines", def:"Lines that intersect at right angles; their slopes are negative reciprocals of each other." },
          { id:"geometry-f6", term:"Parallel lines", def:"Coplanar lines that never intersect and always have the same slope." },
          { id:"geometry-f7", term:"Transversal", def:"A line that intersects two or more coplanar lines at distinct points, creating pairs of related angles." },
          { id:"geometry-f8", term:"Alternate interior/exterior angles", def:"Alternate interior angles lie between the two lines on opposite sides of the transversal; alternate exterior angles lie outside the two lines. Both pairs are congruent." },
          { id:"geometry-f9", term:"Corresponding angles", def:"Angles in the same relative position at each intersection when a transversal crosses two lines; they are congruent." },
          { id:"geometry-f10", term:"Same-side (co-interior) angles", def:"Interior angles on the same side of a transversal are supplementary, summing to 180 degrees." },
          { id:"geometry-f11", term:"Acute, obtuse, right, straight angles", def:"Angles measuring less than 90\u00b0, more than 90\u00b0, exactly 90\u00b0, and exactly 180\u00b0, respectively." },
          { id:"geometry-f12", term:"Vertical angles", def:"Two angles whose sides are opposite rays; vertical angles are always congruent." },
          { id:"geometry-f13", term:"Complementary and supplementary angles", def:"Complementary angles sum to 90 degrees; supplementary angles sum to 180 degrees." },
          { id:"geometry-f14", term:"Angle bisector", def:"A ray that divides an angle into two congruent angles." },
          { id:"geometry-f15", term:"Coterminal angles", def:"Angles that share the same initial and terminal sides, found by adding or subtracting 360\u00b0 (or 2\u03c0 radians) from a given angle." },
          { id:"geometry-f16", term:"Sum of interior angles (convex polygon)", def:"Found using the formula (n-2) \u00d7 180, where n is the number of sides." },
          { id:"geometry-f17", term:"Sum of exterior angles (convex polygon)", def:"Always 360 degrees, regardless of the number of sides." },
          { id:"geometry-f18", term:"Number of diagonals in a polygon", def:"Total diagonals = n(n-3)/2, where n is the number of sides; diagonals from one vertex = n-3." },
          { id:"geometry-f19", term:"Parallelogram", def:"A quadrilateral with opposite sides parallel and congruent, opposite angles congruent, and diagonals that bisect each other." },
          { id:"geometry-f20", term:"Rectangle", def:"A parallelogram with four right angles whose diagonals are congruent as well as bisecting each other." },
          { id:"geometry-f21", term:"Rhombus", def:"A parallelogram with all four sides congruent and diagonals that are perpendicular to each other and bisect the angles." },
          { id:"geometry-f22", term:"Trapezoid", def:"A quadrilateral with exactly one pair of parallel sides; its median is parallel to the bases and equals half their sum." },
          { id:"geometry-f23", term:"Kite", def:"A quadrilateral with two pairs of adjacent congruent sides; its diagonals meet at right angles, and one diagonal bisects the other." }
        ],
        quiz: [

          { id:"artelements-f2", term:"Line types and meaning", def:"Thick lines advance and emphasize; thin lines recede; curved lines suggest calm; zigzag lines create movement and unrest; diagonal lines create depth and perspective." },
          { id:"artelements-f3", term:"Geometric vs. organic shapes", def:"Geometric shapes are mathematically defined (square, circle); organic (biomorphic) shapes are irregular and resemble living forms, as in Georgia O'Keeffe's work." },
          { id:"artelements-f4", term:"Positive and negative shape", def:"The positive shape is the drawn/painted object itself; the negative shape is the area between objects in a composition." },

function todayISO() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`;
}
function parseDay(iso) { const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d); }
function daysBetween(aISO, bISO) {
  return Math.round((parseDay(bISO) - parseDay(aISO)) / 86400000);
}
function fmtDay(iso) {
  return parseDay(iso).toLocaleDateString(undefined, { weekday:"short", month:"long", day:"numeric" });
}
function eventIsPast(ev) { return daysBetween(todayISO(), ev.endDate || ev.date) < 0; }

/* ============================= STATE ============================= */
let progress = null;
let view = { screen: "home" };   // screen: home | category | flashcards | quiz
let session = null;              // holds current session state
let currentSubjectId = "socialStudies"; // which subject tab is showing on the home screen

function findSubject(id) { return SUBJECTS.find(s => s.id === id); }
function findCategory(subjId, catId) { return findSubject(subjId).categories.find(c => c.id === catId); }

function defaultProgress() {
  const p = { flashcards: {}, quiz: {} };
  SUBJECTS.forEach(s => s.categories.forEach(c => {
    c.flashcards.forEach(f => { p.flashcards[f.id] = "new"; });
    c.quiz.forEach(q => { p.quiz[q.id] = { attempts: 0, correct: 0, lastCorrect: false }; });
  }));
  return p;
}

// Progress is saved on this device (localStorage) so the app can keep track of
// which questions have never been asked yet, even across visits.
const STORAGE_KEY = "wms-quick-recall-progress-v1";

function loadProgress() {
  progress = defaultProgress();
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    // Merge: keep saved state only for items that still exist in the content.
    Object.keys(progress.flashcards).forEach(id => {
      if (saved.flashcards && saved.flashcards[id]) progress.flashcards[id] = saved.flashcards[id];
    });
    Object.keys(progress.quiz).forEach(id => {
      if (saved.quiz && saved.quiz[id]) progress.quiz[id] = saved.quiz[id];
    });
  } catch (e) { /* storage unavailable or corrupt — start fresh */ }
}

function saveProgress() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch (e) { /* ignore */ }
}

function clearProgress() {
  progress = defaultProgress();
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
}

/* ============================= HELPERS ============================= */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function categoryStats(cat) {
  const totalF = cat.flashcards.length;
  const knownF = cat.flashcards.filter(f => progress.flashcards[f.id] === "known").length;
  const totalQ = cat.quiz.length;
  const correctQ = cat.quiz.filter(q => progress.quiz[q.id] && progress.quiz[q.id].lastCorrect).length;
  const askedQ = cat.quiz.filter(q => progress.quiz[q.id] && progress.quiz[q.id].attempts > 0).length;
  const total = totalF + totalQ;
  const mastered = knownF + correctQ;
  const pct = total ? Math.round((mastered / total) * 100) : 0;
  return { totalF, knownF, totalQ, correctQ, askedQ, pct };
}

function overallStats(subject) {
  let totalF = 0, knownF = 0, totalQ = 0, attempted = 0, correctSum = 0, attemptSum = 0;
  subject.categories.forEach(c => {
    c.flashcards.forEach(f => { totalF++; if (progress.flashcards[f.id] === "known") knownF++; });
    c.quiz.forEach(q => {
      totalQ++;
      const s = progress.quiz[q.id];
      if (s && s.attempts > 0) attempted++;
      if (s) { correctSum += s.correct; attemptSum += s.attempts; }
    });
  });
  const acc = attemptSum ? Math.round((correctSum / attemptSum) * 100) : 0;
  return { totalF, knownF, totalQ, attempted, acc };
}
