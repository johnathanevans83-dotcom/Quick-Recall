<title>Westport Middle School Quick Recall Guide</title>

<style>
  :root {
    /* Westport Middle School — Warhawks blue & white */
    --bg: #F2F6FC;
    --surface: #FFFFFF;
    --surface-alt: #E8EFFA;
    --ink: #0F2347;
    --ink-soft: #4A5B78;
    --navy: #0B2A5B;
    --blue: #1D4ED8;
    --sky: #3B82F6;
    --sky-light: #BFD4F7;
    --red: #C0392B;
    --line: #C9D6EA;
    --card-shadow: 0 3px 0 rgba(11,42,91,0.08), 0 8px 20px rgba(11,42,91,0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  h1, h2, h3 {
    font-family: 'Montserrat', 'Inter', sans-serif;
    font-weight: 800;
    margin: 0;
    color: var(--ink);
    letter-spacing: -0.01em;
  }

  /* ---------- Header ---------- */
  .masthead {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    margin-bottom: 22px;
    background: linear-gradient(135deg, var(--navy) 0%, #123A7A 100%);
    color: #fff;
    border-radius: 14px;
    border-bottom: 4px solid var(--sky);
    box-shadow: var(--card-shadow);
  }
  .masthead .mark {
    flex-shrink: 0;
    width: 64px; height: 64px;
    background: #fff;
    border-radius: 12px;
    padding: 6px;
    display: flex; align-items: center; justify-content: center;
  }
  .masthead .mark img, .masthead .mark svg { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .masthead h1 { font-size: 24px; line-height: 1.15; color: #fff; }
  .masthead p { margin: 5px 0 0; font-size: 13px; color: var(--sky-light); font-weight: 500; }
  .masthead p b { color: #fff; font-weight: 700; }

  .back-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .back-btn {
    background: none;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--navy);
    cursor: pointer;
    padding: 6px 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .back-btn:hover { text-decoration: underline; }

  /* ---------- Overall stats strip ---------- */
  .subject-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .subject-tab {
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--surface);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .subject-tab:hover { border-color: var(--sky); }
  .subject-tab.active {
    background: var(--navy);
    border-color: var(--navy);
    color: var(--surface);
  }

  .stats-strip {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
  }
  .stat-box {
    flex: 1;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 12px;
    text-align: center;
  }
  .stat-box .num { font-family: 'Montserrat', 'Inter', sans-serif; font-size: 22px; font-weight: 700; color: var(--navy); }
  .stat-box .lbl { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

  /* ---------- Category list ---------- */
  .sheet {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 5px solid var(--blue);
    border-radius: 3px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .sheet:hover { box-shadow: var(--card-shadow); transform: translateY(-1px); }
  .sheet .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .sheet .cat-name { font-family: 'Montserrat', 'Inter', sans-serif; font-size: 16.5px; font-weight: 600; }
  .sheet .cat-num { font-size: 11px; color: var(--ink-soft); letter-spacing: 0.02em; }
  .sheet .cat-desc { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }
  .progress-track {
    height: 6px;
    background: var(--surface-alt);
    border-radius: 3px;
    margin-top: 10px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; background: var(--blue); border-radius: 3px; }
  .pct-label { font-size: 11px; color: var(--ink-soft); margin-top: 4px; text-align: right; }

  .subject-note {
    font-size: 12.5px;
    color: var(--ink-soft);
    border: 1px dashed var(--line);
    border-radius: 4px;
    padding: 10px 12px;
    margin-bottom: 20px;
    font-style: italic;
  }

  /* ---------- Category detail ---------- */
  .cat-header p { color: var(--ink-soft); font-size: 14px; margin-top: 6px; line-height: 1.5; }
  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
  .mode-card {
    background: var(--blue);
    color: var(--surface);
    border: none;
    border-radius: 5px;
    padding: 20px 14px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
  }
  .mode-card:nth-child(2) { background: var(--surface); color: var(--navy); border: 2px solid var(--navy); }
  .mode-card h3 { color: inherit; font-size: 17px; margin-bottom: 4px; }
  .mode-card p { margin: 0; font-size: 12px; opacity: 0.9; }
  .mode-card:hover { filter: brightness(1.05); }

  .mini-stats { display: flex; gap: 20px; margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); }
  .mini-stat { font-size: 13px; color: var(--ink-soft); }
  .mini-stat b { color: var(--ink); font-family: 'Montserrat', 'Inter', sans-serif; }

  /* ---------- Session (shared) ---------- */
  .session-progress { font-size: 12px; color: var(--ink-soft); margin-bottom: 10px; display: flex; justify-content: space-between; }

  /* ---------- Flashcard ---------- */
  .card-stage { perspective: 1200px; margin: 10px 0 18px; }
  .flashcard {
    position: relative;
    min-height: 240px;
    border-radius: 6px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
  }
  .flashcard.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: #FFFFFF;
    box-shadow: var(--card-shadow);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 30px 26px;
  }
  .face.front::before {
    content: '';
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    width: 34px; height: 8px;
    border-bottom: 2px solid var(--line);
    border-radius: 0 0 6px 6px;
  }
  .face .eyebrow { font-size: 11px; color: var(--blue); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 10px; }
  .face .term { font-family: 'Montserrat', 'Inter', sans-serif; font-size: 24px; line-height: 1.25; }
  .face.back { transform: rotateY(180deg); background: #EAF1FB; }
  .face .def { font-size: 15px; line-height: 1.55; color: var(--ink); }
  .tap-hint { text-align: center; font-size: 11.5px; color: var(--ink-soft); margin-top: -6px; margin-bottom: 16px; }

  .fc-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fc-btn {
    padding: 13px 10px;
    border-radius: 5px;
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .fc-btn.learning { background: var(--surface-alt); border: 1px solid var(--line); color: var(--ink); }
  .fc-btn.known { background: var(--blue); color: var(--surface); }
  .fc-btn:disabled { opacity: 0.5; cursor: default; }

  /* ---------- Quiz ---------- */
  .quiz-q {
    background: #FFFFFF;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 22px 20px;
    margin-bottom: 16px;
  }
  .quiz-q .term { font-family: 'Montserrat', 'Inter', sans-serif; font-size: 18px; line-height: 1.4; }
  .options { display: flex; flex-direction: column; gap: 9px; }
  .opt-btn {
    text-align: left;
    padding: 13px 14px;
    border-radius: 5px;
    border: 1px solid var(--line);
    background: var(--surface);
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    cursor: pointer;
    color: var(--ink);
  }
  .opt-btn:hover:not(:disabled) { border-color: var(--sky); }
  .opt-btn.correct { background: var(--blue); border-color: var(--blue); color: var(--surface); font-weight: 600; }
  .opt-btn.incorrect { background: var(--red); border-color: var(--red); color: var(--surface); font-weight: 600; }
  .opt-btn:disabled { cursor: default; }

  .next-row { margin-top: 16px; display: flex; justify-content: flex-end; }
  .primary-btn {
    background: var(--navy);
    color: var(--surface);
    border: none;
    border-radius: 5px;
    padding: 12px 22px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .primary-btn:hover { filter: brightness(1.1); }
  .ghost-btn {
    background: none;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 12px 22px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    color: var(--ink);
  }

  .score-banner {
    text-align: center;
    padding: 30px 20px;
    background: var(--surface-alt);
    border-radius: 6px;
    border: 1px solid var(--line);
  }
  .score-banner .big { font-family: 'Montserrat', 'Inter', sans-serif; font-size: 40px; font-weight: 700; color: var(--navy); }
  .score-banner p { color: var(--ink-soft); font-size: 14px; margin-top: 4px; }
  .score-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: center; flex-wrap: wrap; }

  footer.app-footer {
    margin-top: 30px;
    text-align: center;
    font-size: 11.5px;
    color: var(--ink-soft);
  }
  footer.app-footer button {
    background: none; border: none; text-decoration: underline; color: var(--ink-soft);
    font-size: 11.5px; cursor: pointer; font-family: inherit;
  }

  @media (max-width: 420px) {
    .mode-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

      {
        id: "numbertheory", name: "Number Theory", num: "Category 1",
        desc: "Real vs. imaginary numbers, properties of real numbers, primes, factorization, sets, and number bases.",
        flashcards: [
          { id:"numbertheory-f1", term:"Rational number", def:"Any number expressible as a/b, where a and b are integers and b\u2260 0; in decimal form it terminates or repeats." },
          { id:"numbertheory-f2", term:"Irrational number", def:"A number that cannot be written as the quotient of two integers; in decimal form it never terminates or repeats." },
          { id:"numbertheory-f3", term:"Natural numbers", def:"The positive integers greater than 0, {1, 2, 3, \u2026}; also called the counting numbers." },
          { id:"numbertheory-f4", term:"Whole numbers", def:"Zero plus the positive integers, {0, 1, 2, 3, \u2026}." },
          { id:"numbertheory-f5", term:"Imaginary unit (i)", def:"Defined as the square root of -1; the powers of i cycle through i, -1, -i, and 1 every four exponents." },
          { id:"numbertheory-f6", term:"Complex number", def:"A number combining a real and an imaginary part, written in the form a + bi; its conjugate pair is a - bi." },
          { id:"numbertheory-f7", term:"Commutative Property", def:"Changing the order of addends or factors does not change the sum or product (A + B = B + A)." },
          { id:"numbertheory-f8", term:"Associative Property", def:"Changing the grouping of addends or factors does not change the sum or product." },
          { id:"numbertheory-f9", term:"Distributive Property", def:"a(b + c) = ab + ac; distributing a multiplier across the terms of a sum gives the same result as adding first." },
          { id:"numbertheory-f10", term:"Identity and Inverse Properties", def:"Adding 0 or multiplying by 1 leaves a number unchanged (Identity); every nonzero number has a reciprocal that multiplies with it to equal 1 (Inverse)." },
          { id:"numbertheory-f11", term:"Prime number", def:"A counting number with exactly two factors, 1 and itself; the number 1 is neither prime nor composite." },
          { id:"numbertheory-f12", term:"Relatively prime numbers", def:"Two numbers whose only common factor is 1, such as 5 and 8, or 9 and 35." },
          { id:"numbertheory-f13", term:"Twin primes", def:"A pair of prime numbers whose difference is 2, such as 5 and 7, or 11 and 13." },
          { id:"numbertheory-f14", term:"Euler (Symmetric) primes", def:"A pair of prime numbers that are the same distance from a given number on a number line, such as 3 and 5 (both 1 away from 4)." },
          { id:"numbertheory-f15", term:"Prime factorization", def:"Breaking a number down into a product of only prime factors; useful for finding the LCM, GCF, and number of factors." },
          { id:"numbertheory-f16", term:"Composite number", def:"A number that has more than two factors; the first six composite numbers are 4, 6, 8, 9, 10, and 12." },
          { id:"numbertheory-f17", term:"Divisibility rule for 3", def:"A number is divisible by 3 if the sum of its digits is divisible by 3." },
          { id:"numbertheory-f18", term:"Divisibility rule for 11", def:"A number is divisible by 11 if the alternating sum and difference of its digits, starting from the ones place, is divisible by 11." },
          { id:"numbertheory-f19", term:"Sets and subsets", def:"To find the number of possible subsets of a set, raise 2 to the power of the number of elements; a set of 5 elements has 2\u2075 = 32 subsets." },
          { id:"numbertheory-f20", term:"Union and Intersection of Sets", def:"The union (\u222a) combines all elements of two sets; the intersection (\u2229) includes only elements common to both sets." },
          { id:"numbertheory-f21", term:"Disjoint sets", def:"Two sets that share no elements in common, so their intersection is the empty set." },
          { id:"numbertheory-f22", term:"Abundant number", def:"A number whose proper factors sum to more than the number itself, such as 12 (1+2+3+4+6=16)." },
          { id:"numbertheory-f23", term:"Deficient number", def:"A number whose proper factors sum to less than the number itself, such as 8 (1+2+4=7)." },
          { id:"numbertheory-f24", term:"Perfect number", def:"A number whose proper factors sum exactly to the number itself, such as 6 (1+2+3=6) or 28." },

/* ============================= STATE ============================= */
let progress = null;
let view = { screen: "home" };   // screen: home | category | flashcards | quiz
let session = null;              // holds current session state
let currentSubjectId = "socialStudies"; // which subject tab is showing on the home screen

function findSubject(id) { return SUBJECTS.find(s => s.id === id); }
function findCategory(subjId, catId) { return findSubject(subjId).categories.find(c => c.id === catId); }

function defaultProgress() {
  const p = { flashcards: {}, quiz: {} };
  SUBJECTS.forEach(s => s.categories.forEach(c => {
    c.flashcards.forEach(f => { p.flashcards[f.id] = "new"; });
    c.quiz.forEach(q => { p.quiz[q.id] = { attempts: 0, correct: 0, lastCorrect: false }; });
  }));
  return p;
}

// Progress is tracked for the current visit only and resets on reload.
function loadProgress() {
  progress = defaultProgress();
}

function saveProgress() { /* no-op for now — nothing is persisted */ }

/* ============================= HELPERS ============================= */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function categoryStats(cat) {
  const totalF = cat.flashcards.length;
  const knownF = cat.flashcards.filter(f => progress.flashcards[f.id] === "known").length;
  const totalQ = cat.quiz.length;
  const correctQ = cat.quiz.filter(q => progress.quiz[q.id] && progress.quiz[q.id].lastCorrect).length;
  const total = totalF + totalQ;
  const mastered = knownF + correctQ;
  const pct = total ? Math.round((mastered / total) * 100) : 0;
  return { totalF, knownF, totalQ, correctQ, pct };
}

function overallStats(subject) {
  let totalF = 0, knownF = 0, totalQ = 0, attempted = 0, correctSum = 0, attemptSum = 0;
  subject.categories.forEach(c => {
    c.flashcards.forEach(f => { totalF++; if (progress.flashcards[f.id] === "known") knownF++; });
    c.quiz.forEach(q => {
      totalQ++;
      const s = progress.quiz[q.id];
      if (s && s.attempts > 0) attempted++;
      if (s) { correctSum += s.correct; attemptSum += s.attempts; }
    });
  });
  const acc = attemptSum ? Math.round((correctSum / attemptSum) * 100) : 0;
  return { totalF, knownF, totalQ, attempted, acc };
}

/* ============================= RENDER ============================= */
const app = document.getElementById("app");

const SCHOOL_LOGO = "https://cmsv2-assets.apptegy.net/uploads/21451/logo/24265/Westport_Middle.png";
function logoMark() {
  // Official Westport Middle logo; if it ever fails to load, fall back to a W shield.
  return `
  <div class="mark" aria-hidden="true">
    <img src="${SCHOOL_LOGO}" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
    <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" style="display:none">
      <path d="M6 6h48v26c0 14-11 22-24 24C17 54 6 46 6 32z" fill="var(--navy)"/>
      <text x="30" y="41" text-anchor="middle" font-family="Montserrat, Arial Black, Arial" font-weight="800" font-size="30" fill="#fff">W</text>
    </svg>
  </div>`;
}

function render() {
  if (view.screen === "home") return renderHome();
  if (view.screen === "category") return renderCategory();
  if (view.screen === "flashcards") return renderFlashcards();
  if (view.screen === "quiz") return renderQuiz();
}

function renderHome() {
  if (!findSubject(currentSubjectId)) currentSubjectId = SUBJECTS[0].id;
  const subject = findSubject(currentSubjectId);
  const stats = overallStats(subject);
  app.innerHTML = `
    <div class="masthead">
      ${logoMark()}
      <div>
        <h1>Westport Middle School Quick Recall Guide</h1>
        <p><b>Westport Warhawks</b> &middot; KAAC Governors Cup study companion</p>
      </div>
    </div>

    <div class="subject-tabs" id="subject-tabs"></div>

    <div class="stats-strip">
      <div class="stat-box"><div class="num">${stats.knownF}/${stats.totalF}</div><div class="lbl">Cards known today</div></div>
      <div class="stat-box"><div class="num">${stats.attempted}/${stats.totalQ}</div><div class="lbl">Quiz Qs tried</div></div>
      <div class="stat-box"><div class="num">${stats.acc}%</div><div class="lbl">Quiz accuracy</div></div>
    </div>

    <h2 style="font-size:15px; margin-bottom:12px; color:var(--ink-soft); font-family:'Inter',sans-serif; font-weight:600;">${subject.name}</h2>
    <div id="cat-list"></div>

    <div class="subject-note">More subject areas will show up here as new study guides get added — just upload the next PDF whenever it's ready.</div>

    <footer class="app-footer">
      Tracking covers this visit only &mdash; reloading starts fresh.
      <button id="reset-btn" style="margin-left:6px;">Start over now</button>
    </footer>
  `;
  const tabs = document.getElementById("subject-tabs");
  SUBJECTS.forEach(s => {
    const btn = document.createElement("button");
    btn.className = "subject-tab" + (s.id === currentSubjectId ? " active" : "");
    btn.textContent = s.name;
    btn.addEventListener("click", () => { currentSubjectId = s.id; render(); });
    tabs.appendChild(btn);
  });
  const list = document.getElementById("cat-list");
  subject.categories.forEach(cat => {
    const st = categoryStats(cat);
    const div = document.createElement("div");
    div.className = "sheet";
    div.innerHTML = `
      <div class="row">
        <div class="cat-name">${cat.name}</div>
        <div class="cat-num">${st.pct}%</div>
      </div>
      <div class="cat-desc">${cat.desc}</div>
      <div class="progress-track"><div class="progress-fill" style="width:${st.pct}%"></div></div>
    `;
    div.addEventListener("click", () => { view = { screen: "category", subjId: currentSubjectId, catId: cat.id }; render(); });
    list.appendChild(div);
  });
  document.getElementById("reset-btn").addEventListener("click", () => {
    progress = defaultProgress();
    render();
  });
}

function renderCategory() {
  const cat = findCategory(view.subjId, view.catId);
  const st = categoryStats(cat);
  app.innerHTML = `
    <div class="back-row">
      <button class="back-btn" id="back-home">&larr; All categories</button>
    </div>
    <div class="cat-header">
      <div class="cat-num" style="font-size:11px; color:var(--blue); font-weight:700; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:4px;">${cat.num}</div>
      <h1 style="font-size:22px;">${cat.name}</h1>
      <p>${cat.desc}</p>
    </div>
    <div class="mode-grid">
      <button class="mode-card" id="go-flash">
        <h3>Flashcards</h3>
        <p>${cat.flashcards.length} cards &middot; flip and self-rate</p>
      </button>
      <button class="mode-card" id="go-quiz">
        <h3>Quiz yourself</h3>
        <p>${cat.quiz.length} questions &middot; multiple choice</p>
      </button>
    </div>
    <div class="mini-stats">
      <div class="mini-stat"><b>${st.knownF}/${st.totalF}</b> cards known</div>
      <div class="mini-stat"><b>${st.correctQ}/${st.totalQ}</b> quiz correct (last try)</div>
    </div>
  `;
  document.getElementById("back-home").addEventListener("click", () => { view = { screen: "home" }; render(); });
  document.getElementById("go-flash").addEventListener("click", () => startFlashcards());
  document.getElementById("go-quiz").addEventListener("click", () => startQuiz());
}

/* ---------- Flashcards ---------- */
function startFlashcards() {
  const cat = findCategory(view.subjId, view.catId);
  session = {
    order: shuffle(cat.flashcards.map((_, i) => i)),
    idx: 0,
    flipped: false,
    seen: 0,
    known: 0,
    learning: 0
  };
  view = { screen: "flashcards", subjId: view.subjId, catId: view.catId };
  render();
}

function renderFlashcards() {
  const cat = findCategory(view.subjId, view.catId);
  const total = session.order.length;
  if (session.idx >= total) {
    app.innerHTML = `
      <div class="back-row"><button class="back-btn" id="back-cat">&larr; ${cat.name}</button></div>
      <div class="score-banner">
        <div class="big">Session complete</div>
        <p>Marked ${session.known} card${session.known===1?"":"s"} as known, ${session.learning} still learning.</p>
        <div class="score-actions">
          <button class="primary-btn" id="restart">Go again</button>
          <button class="ghost-btn" id="to-cat">Back to category</button>
        </div>
      </div>
    `;
    document.getElementById("back-cat").addEventListener("click", () => { view = { screen: "category", subjId: view.subjId, catId: view.catId }; render(); });
    document.getElementById("restart").addEventListener("click", () => startFlashcards());
    document.getElementById("to-cat").addEventListener("click", () => { view = { screen: "category", subjId: view.subjId, catId: view.catId }; render(); });
    return;
  }
  const card = cat.flashcards[session.order[session.idx]];
  app.innerHTML = `
    <div class="back-row">
      <button class="back-btn" id="back-cat">&larr; ${cat.name}</button>
      <div class="session-progress" style="margin:0;">Card ${session.idx+1} of ${total}</div>
    </div>
    <div class="card-stage">
      <div class="flashcard ${session.flipped ? "flipped" : ""}" id="fc">
        <div class="face front">
          <div class="eyebrow">Term</div>
          <div class="term">${card.term}</div>
        </div>
        <div class="face back">
          <div class="eyebrow">Definition</div>
          <div class="def">${card.def}</div>
        </div>
      </div>
    </div>
    <div class="tap-hint">${session.flipped ? "Tap the card to flip back" : "Tap the card to reveal the definition"}</div>
    <div class="fc-actions">
      <button class="fc-btn learning" id="mark-learning" ${session.flipped ? "" : "disabled"}>Still learning</button>
      <button class="fc-btn known" id="mark-known" ${session.flipped ? "" : "disabled"}>Know it</button>
    </div>
  `;
  document.getElementById("back-cat").addEventListener("click", () => { view = { screen: "category", subjId: view.subjId, catId: view.catId }; render(); });
  document.getElementById("fc").addEventListener("click", () => { session.flipped = !session.flipped; render(); });
  document.getElementById("mark-learning").addEventListener("click", (e) => {
    e.stopPropagation();
    progress.flashcards[card.id] = "learning";
    session.learning++;
    saveProgress();
    session.idx++; session.flipped = false;
    render();
  });
  document.getElementById("mark-known").addEventListener("click", (e) => {
    e.stopPropagation();
    progress.flashcards[card.id] = "known";
    session.known++;
    saveProgress();
    session.idx++; session.flipped = false;
    render();
  });
}

/* ---------- Quiz ---------- */
function startQuiz() {
  const cat = findCategory(view.subjId, view.catId);
  session = {
    order: shuffle(cat.quiz.map((_, i) => i)),
    idx: 0,
    answered: false,
    selected: null,
    correctCount: 0,
    missed: []
  };
  view = { screen: "quiz", subjId: view.subjId, catId: view.catId };
  render();
}

function renderQuiz() {
  const cat = findCategory(view.subjId, view.catId);
  const total = session.order.length;
  if (session.idx >= total) {
    const pct = Math.round((session.correctCount / total) * 100);
    app.innerHTML = `
      <div class="back-row"><button class="back-btn" id="back-cat">&larr; ${cat.name}</button></div>
      <div class="score-banner">
        <div class="big">${session.correctCount}/${total}</div>
        <p>${pct}% correct this round</p>
        <div class="score-actions">
          <button class="primary-btn" id="restart">Quiz again</button>
          ${session.missed.length ? `<button class="ghost-btn" id="review-missed">Review ${session.missed.length} missed</button>` : ""}
          <button class="ghost-btn" id="to-cat">Back to category</button>
        </div>
      </div>
    `;
    document.getElementById("back-cat").addEventListener("click", () => { view = { screen: "category", subjId: view.subjId, catId: view.catId }; render(); });
    document.getElementById("restart").addEventListener("click", () => startQuiz());
    document.getElementById("to-cat").addEventListener("click", () => { view = { screen: "category", subjId: view.subjId, catId: view.catId }; render(); });
    const rm = document.getElementById("review-missed");
    if (rm) rm.addEventListener("click", () => {
      session = { order: shuffle(session.missed.slice()), idx: 0, answered: false, selected: null, correctCount: 0, missed: [] };
      render();
    });
    return;
  }
  const q = cat.quiz[session.order[session.idx]];
  app.innerHTML = `
    <div class="back-row">
      <button class="back-btn" id="back-cat">&larr; ${cat.name}</button>
      <div class="session-progress" style="margin:0;">Question ${session.idx+1} of ${total} &middot; Score ${session.correctCount}</div>
    </div>
    <div class="quiz-q">
      <div class="term">${q.q}</div>
    </div>
    <div class="options" id="opts"></div>
    <div class="next-row" id="next-row" style="display:none;">
      <button class="primary-btn" id="next-btn">Next</button>
    </div>
  `;
  document.getElementById("back-cat").addEventListener("click", () => { view = { screen: "category", subjId: view.subjId, catId: view.catId }; render(); });
  const optsWrap = document.getElementById("opts");
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.textContent = opt;
    btn.addEventListener("click", () => {
      if (session.answered) return;
      session.answered = true;
      session.selected = i;
      const isCorrect = i === q.correct;
      const st = progress.quiz[q.id] || { attempts: 0, correct: 0, lastCorrect: false };
      st.attempts++;
      if (isCorrect) { st.correct++; session.correctCount++; } else { session.missed.push(session.order[session.idx]); }
      st.lastCorrect = isCorrect;
      progress.quiz[q.id] = st;
      saveProgress();
      [...optsWrap.children].forEach((b, bi) => {
        b.disabled = true;
        if (bi === q.correct) b.classList.add("correct");
        else if (bi === i) b.classList.add("incorrect");
      });
      document.getElementById("next-row").style.display = "flex";
    });
    optsWrap.appendChild(btn);
  });
  document.getElementById("next-btn").addEventListener("click", () => {
    session.idx++; session.answered = false; session.selected = null;
    render();
  });
}

/* ============================= INIT ============================= */
(function init() {
  loadProgress();
  render();
})();
</script>
